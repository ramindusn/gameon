name: Deploy

# Push-to-deploy: every push to main builds the app (prod env vars from secrets)
# and ships it to the PROD Cloudflare Pages project (badmintonduo-prod →
# badmintonduo.club). Dev (badmintonduo.pages.dev) is deployed manually with
# `npm run deploy:dev`.

on:
  push:
    branches: [main]
  # Lets a deploy be re-run without an empty commit. Added after a run sat
  # queued for six hours having never been assigned a job — GitHub reported the
  # run as both "queued" and "completed", and there was no way to retrigger it.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Dormant until the Cloudflare API token secret is added — skips cleanly so
      # pushes don't fail before deploy is wired up. A step's `if:` can't read
      # the `secrets` context at all (GitHub rejects the whole workflow file if
      # it tries), so the presence check runs as its own step and hands the
      # result through `steps.*.outputs` instead — keeps the token out of the
      # earlier install/build steps' environment without an invalid `if:`.
      - name: Check Cloudflare token
        id: cf
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/badminton/dist --project-name=badmintonduo-prod --branch=main
