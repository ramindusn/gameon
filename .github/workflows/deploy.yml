name: Deploy

# Push-to-deploy: every push to main builds the app (prod env vars from secrets)
# and ships it to the PROD Cloudflare Pages project (badmintonduo-prod →
# badmintonduo.club). Dev (badmintonduo.pages.dev) is deployed manually with
# `npm run deploy:dev`.

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Promote the token to job scope so the deploy step's `if` can actually see
    # it — a step-level `env:` isn't visible when its own `if:` is evaluated.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Dormant until the Cloudflare API token secret is added — skips cleanly so
      # pushes don't fail before deploy is wired up.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/badminton/dist --project-name=badmintonduo-prod --branch=main
